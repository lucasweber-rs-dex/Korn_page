services:
  pagina:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: tahingresso-web
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 96m
    cpus: 0.25

  api:
    build: ./api
    container_name: tahingresso-api
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      SERVE_STATIC: "0"
      PORT: "3001"
    expose:
      - "3001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 96m
    cpus: 0.25

  caddy:
    image: caddy:2-alpine
    container_name: tahingresso-https
    restart: unless-stopped
    depends_on:
      - pagina
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25

volumes:
  caddy_data:
  caddy_config:
